# Projeto de produto. Nasceu como scaffold de build na S-00 e ganhou código na
# S-02: API, grafo, observabilidade e limites de custo.
#
# Lint e format vêm do ruff.toml da raiz — uma régua só, um lugar só.

[project]
name = "vendinha"
version = "0.1.0"
description = "Agente de vendas do empório mineiro digital"
requires-python = ">=3.12"
dependencies = [
    # API. sse-starlette em vez de StreamingResponse à mão: ele trata
    # desconexão do cliente e heartbeat, que é justamente o que se erra ao
    # escrever SSE na mão e só se descobre com o navegador aberto.
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.34",
    "sse-starlette>=3.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",

    # Agente. `langchain` entra pelo `init_chat_model`: é ele que faz o código
    # não conhecer fornecedor (ADR-012). Os pacotes de provedor são o que
    # habilita cada um — adicionar um terceiro é uma linha aqui.
    "langchain>=1.0",
    "langchain-anthropic>=1.0",
    "langchain-openai>=1.0",
    "langgraph>=1.2",
    "langgraph-checkpoint-postgres>=3.1",

    # Observabilidade. v4 é reescrita sobre OpenTelemetry e é a que documenta
    # `mask_otel_spans`, o hook onde a redação de PII acontece antes do export.
    "langfuse>=4.14",

    # Postgres: domínio, checkpointer do grafo e a configuração cifrada.
    "psycopg[binary,pool]>=3.2",
    "cryptography>=43",

    # Qdrant: o índice semântico do catálogo (S-03). Cliente cru, e não
    # `langchain-qdrant`: aqui o Qdrant ranqueia e devolve ids — quem afirma
    # qualquer fato é o Postgres. Um VectorStore guardaria o texto do produto
    # dentro do índice, criando uma segunda morada para o mesmo fato (S-03, D-5).
    "qdrant-client>=1.13",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    # A suíte vive em tests/, na raiz, e o `typecheck` passou a cobri-la na S-02
    # (ressalva R-4 da verificação da S-01). Para tipar aqueles arquivos o mypy
    # precisa das mesmas dependências que eles importam.
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "types-PyYAML>=6.0",
    "jsonschema>=4.21",
    "types-jsonschema>=4.26.0.20260518",
    "ruff==0.16.4",
    # O runner de evals (S-03) lê os casos de `evals/*.yaml`. Fica no grupo dev
    # porque eval é portão de release, não caminho de atendimento.
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vendinha"]
# PEP 561. Without this marker mypy refuses to read the package's own types from
# outside it, and every `from vendinha... import` in tests/ becomes `Any` — the
# suite would be inside the type gate and learn nothing from being there.
artifacts = ["vendinha/py.typed"]

[tool.mypy]
python_version = "3.12"
# strict desde o primeiro arquivo: ligar tipagem estrita depois que o código
# existe é uma migração; ligar antes é só uma configuração.
strict = true
warn_unreachable = true
# O contrato de fronteira é Pydantic (CLAUDE.md). Dict sem tipo na fronteira é
# exatamente o que essa regra existe para barrar.
disallow_any_generics = true

[[tool.mypy.overrides]]
# Dependências sem stubs ganham exceção nomeada aqui, uma a uma. Nunca global.
module = []
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
