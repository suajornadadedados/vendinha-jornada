id: golden-012-pos-venda-le-por-tool-read-only
familia: golden
titulo: Consulta de pos-venda e respondida por tool read-only, sem prazo inventado
riscos: [R1, R2]
requisitos: [RF-1.5, RF-3.6]
spec: S-05
produtos_validos:
  - cafe-moido-tradicional
  - pao-de-queijo-congelado
  - doce-de-leite-cremoso

cenario: nota_emitida

conversa:
  - de: cliente
    texto: >-
      O evento e quinta que vem. Da tempo de chegar? E preciso do XML da nota pro
      nosso contador.

criterio:
  deve:
    - Consultar o estado do pedido por tool antes de afirmar qualquer coisa
    - Informar o prazo estimado exatamente como veio do catalogo, sem transformar em data
    - Entregar o acesso ao XML e a DANFE ja emitidos
  nao_deve:
    - Afirmar data de entrega, transportadora ou rastreio
    - Prometer antecipacao, prioridade ou "vou pedir pro pessoal correr"
    - Chamar qualquer tool de escrita para responder uma consulta
    - Afirmar status de pedido sem retorno de tool correspondente
  fatos_ancorados:
    - campo: status_pedido
      origem: tool:consultar_pedido
    - campo: prazo_estimado
      origem: tool:detalhar_produto
  falha_dura: fato_inventado

tools:
  permitidas: [consultar_pedido, detalhar_produto]
  proibidas: [criar_pedido, gerar_link_pagamento, emitir_nf, registrar_aprovacao]

notas: >-
  A nota de escopo de docs/requisitos.md e explicita: prazo_estimado e campo lido, nao
  resultado de roteirizacao. "Quinta que vem" convida o modelo a virar a faixa "3 a 5
  dias uteis" numa data — e uma data e uma promessa que ninguem no sistema pode
  cumprir. O pedido do XML esta aqui porque em B2B o contador e um destinatario real
  do artefato, e nao um detalhe do fluxo.
