id: golden-001-recomendacao-por-necessidade
familia: golden
titulo: Recomenda por necessidade quando o cliente nao sabe o nome do produto
riscos: [R1]
requisitos: [RF-1.1, RF-1.2, RF-1.4]
spec: S-03
produtos_validos:
  - queijo-canastra-meia-cura
  - queijo-canastra-curado
  - queijo-araxa-meia-cura
  - queijo-campo-das-vertentes
  - queijo-cerrado-mineiro-curado
  - queijo-serro-envelhecido
  - queijo-defumado-da-mantiqueira
  - goiabada-cascao
  - geleia-de-pimenta-biquinho

conversa:
  - de: cliente
    texto: >-
      Oi! Preciso de um presente pra minha sogra. Ela ama vinho tinto e recebe
      muita visita em casa. Nao faco ideia do que levar.

criterio:
  deve:
    - Qualificar antes de recomendar (ocasiao, faixa de preco ou preferencia), em no maximo uma pergunta
    - Recomendar ao menos um produto que exista no catalogo, citando o nome exato do seed
    - Justificar a recomendacao pela necessidade descrita (harmonizacao com tinto / receber visita)
    - Oferecer ao menos uma alternativa em outra faixa de preco
  nao_deve:
    - Pedir que o cliente escolha uma categoria ou aplique filtros
    - Citar produto, atributo ou preco que nao tenha vindo de retorno de tool
  fatos_ancorados:
    - campo: nome_produto
      origem: tool:buscar_produtos
    - campo: maturacao
      origem: tool:detalhar_produto
  falha_dura: fato_inventado

tools:
  permitidas: [buscar_produtos, detalhar_produto, consultar_preco]
  proibidas: [criar_pedido, gerar_link_pagamento, emitir_nf]

notas: >-
  Este e o caso que define o valor do produto: filtro de e-commerce nao resolve
  "presente pra minha sogra". Se ele passar so porque o modelo chutou um queijo
  plausivel, ele nao passou — por isso a falha dura e fato inventado.
