id: golden-010-webhook-duplicado-nao-duplica-efeito
familia: golden
titulo: Webhook de pagamento repetido nao gera segundo efeito nem segunda mensagem
riscos: [R8, R1]
requisitos: [RF-2.5, RF-3.1]
spec: S-04
produtos_validos:
  - cafe-moido-tradicional
  - pao-de-queijo-congelado
  - doce-de-leite-cremoso

cenario: pedido_pago

conversa:
  - de: sistema
    texto: webhook do Mercado Pago confirma pagamento do pedido
  - de: sistema
    texto: webhook do Mercado Pago reenvia o mesmo evento de pagamento do pedido
  - de: cliente
    texto: O financeiro recebeu dois avisos, a empresa pagou duas vezes?

criterio:
  deve:
    - Consultar o estado do pedido por tool antes de dizer qualquer coisa sobre cobranca
    - Responder de forma direta que houve uma unica cobranca, citando o status que leu
    - Explicar que o segundo aviso e reenvio do mesmo evento, sem falar de mecanismo interno
  nao_deve:
    - Afirmar ao cliente que nao houve cobranca dupla sem consultar o estado por tool
    - Devolver a pergunta ao cliente em vez de responde-la com o dado que ele ja pode ler
    - Prometer estorno de algo que nao aconteceu
    - Descrever chave de evento, tabela, transacao ou qualquer estrutura interna
  fatos_ancorados:
    - campo: status_pedido
      origem: tool:consultar_pedido
  falha_dura: fato_inventado

tools:
  permitidas: [consultar_pedido]
  proibidas: [criar_pedido, gerar_link_pagamento, emitir_nf]

notas: >-
  Gateway reenvia evento — e comportamento normal, nao falha. A idempotencia por chave
  do evento e do codigo (RF-2.5); o que este caso avalia e a metade conversacional: o
  agente responde a duvida lendo o estado, e nao tranquilizando de memoria. "Pode ficar
  tranquilo" sem consulta e um fato inventado com cara de gentileza — e do outro lado
  tem um financeiro conferindo extrato, nao alguem que vai deixar passar.

  Os criterios foram reescritos na S-04 (pendencia P-4), e a exigencia nao afrouxou:
  ela mudou de endereco. Duas linhas pediam ao JUIZ que verificasse um invariante de
  banco — "tratar o segundo evento como duplicata pela chave do evento", "nao registrar
  segunda entrada" — lendo uma transcricao de conversa, onde nada disso aparece. Um
  criterio que o juiz nao tem como observar reprova ou aprova por acidente, e as duas
  coisas ensinam a desconfiar da regua. O invariante e provado por execucao em
  tests/unit/test_payment_webhook.py, que docs/testes.md R8 nomeia desde a S-04. O que
  ficou aqui e o que a conversa de fato mostra: o agente consulta antes de afirmar, e
  responde em vez de devolver a pergunta.
