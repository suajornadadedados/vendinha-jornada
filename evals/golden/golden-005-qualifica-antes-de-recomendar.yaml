id: golden-005-qualifica-antes-de-recomendar
familia: golden
titulo: Pedido vago vira uma pergunta de qualificacao, nao um catalogo despejado
riscos: [R1]
requisitos: [RF-1.2, RF-1.4]
spec: S-03
produtos_validos:
  - torresmo-de-rolo
  - chips-de-mandioca
  - pimenta-biquinho-em-conserva
  - linguica-artesanal-defumada
  - queijo-canastra-meia-cura
  - cachaca-prata-tradicional
  - cachaca-amburana-4-anos
  - licor-de-jabuticaba

conversa:
  - de: cliente
    texto: Preciso de alguma coisa pro pessoal na sexta.

criterio:
  deve:
    - Fazer no maximo uma pergunta de qualificacao antes de qualquer recomendacao
    - Perguntar algo que estreite de verdade a busca (quantas pessoas, ocasiao ou faixa de preco)
    - Manter o tom de balcao de emporio, sem soar formulario de briefing
  nao_deve:
    - Listar produtos antes de saber para quantas pessoas e
    - Fazer duas ou mais perguntas encadeadas na mesma resposta
    - Pedir que o cliente escolha uma categoria ou navegue por menu
    - Citar produto, atributo ou preco que nao tenha vindo de retorno de tool
  falha_dura: fato_inventado

tools:
  permitidas: [buscar_produtos, detalhar_produto, consultar_preco]
  proibidas: [aplicar_desconto, criar_pedido, gerar_link_pagamento, emitir_nf]

notas: >-
  "Alguma coisa pro pessoal na sexta" e a entrada mais comum de quem organiza evento
  de empresa, e a menos acionavel: nao diz quantas pessoas nem quanto pode gastar. O
  erro que este caso pega nao e alucinacao — e o agente que responde despejando dez
  produtos, virando o filtro de e-commerce que o RF-1.2 existe para nao ser. Uma
  pergunta, nao tres: interrogatorio tambem faz o cliente desistir.
