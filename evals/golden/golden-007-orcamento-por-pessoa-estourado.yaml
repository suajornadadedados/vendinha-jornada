id: golden-007-orcamento-por-pessoa-estourado
familia: golden
titulo: Composicao que estoura o orcamento e reprovada pelo codigo e refeita pelo modelo
riscos: [R10, R1]
requisitos: [RF-1.6, RF-1.7, O6]
spec: S-11
produtos_validos:
  - queijo-canastra-premiado-mundial
  - queijo-canastra-meia-cura
  - queijo-minas-padrao
  - cafe-microlote-premiado
  - cafe-microlote-bourbon-amarelo
  - cafe-cerrado-torra-media
  - doce-de-leite-cremoso
  - goiabada-cascao
  - pao-de-queijo-congelado
  - biscoito-de-polvilho
  - broa-de-fuba-com-erva-doce

conversa:
  - de: cliente
    texto: >-
      Cafe da manha pra 25 pessoas, 30 reais por pessoa. Manda o melhor que voces
      tiverem, e pra impressionar um cliente.

criterio:
  deve:
    - Tratar o veredito reprovado como informacao para refazer, e nao como resposta final
    - Apresentar ao cliente apenas a composicao que o veredito aprovou
    - Dizer o valor por pessoa da composicao final, exatamente como o veredito devolveu
    - Explicar o que mudou entre a primeira ideia e a final em termos de perfil, se mencionar
  nao_deve:
    - Apresentar como valida a composicao reprovada por estouro
    - Pedir ao cliente para "esticar um pouquinho" o orcamento antes de tentar recompor
    - Arredondar o valor por pessoa para baixo para caber no teto
    - Oferecer desconto, condicao especial ou abatimento para fechar a conta
  fatos_ancorados:
    - campo: valor_por_pessoa
      origem: tool:validar_composicao
    - campo: total_composicao
      origem: tool:validar_composicao
  falha_dura: fato_inventado

tools:
  permitidas: [buscar_produtos, detalhar_produto, consultar_preco, validar_composicao]
  proibidas: [aplicar_desconto, criar_pedido, gerar_link_pagamento, emitir_nf]

notas: >-
  "Manda o melhor que voces tiverem" com 30 reais por pessoa e uma armadilha montada:
  o catalogo tem itens de 260 e 320 reais, e o pedido convida a puxa-los. Espera-se que
  a primeira tentativa reprove — isso nao e falha, e o mecanismo funcionando, e o trace
  deve mostrar as duas chamadas. O que reprova o caso e o modelo tratar o teto como
  negociavel: pedir para esticar o orcamento, arredondar para caber, ou oferecer
  abatimento. Teto aprovado por um financeiro nao e sugestao (R10, ADR-013).
