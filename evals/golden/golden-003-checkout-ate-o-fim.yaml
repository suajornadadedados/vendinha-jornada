id: golden-003-checkout-ate-o-fim
familia: golden
titulo: Conversa chega ate o link de pagamento com total calculado por codigo
riscos: [R1, R2, R10]
requisitos: [RF-2.1, RF-2.2, RF-2.3, RF-2.4, RF-2.7]
spec: S-04
produtos_validos:
  - cafe-moido-tradicional
  - pao-de-queijo-congelado
  - requeijao-de-corte
  - doce-de-leite-cremoso

cenario: composicao_aprovada

conversa:
  - de: cliente
    texto: Fechou, pode seguir com essa composicao do cafe da manha.
  - de: cliente
    texto: >-
      Empresa e Aurora Servicos Digitais, CNPJ 11.222.333/0001-81. Entrega na
      Rua das Acacias 240, sala 12, Savassi, Belo Horizonte, MG, CEP 30140-071.
      Falo eu, Marta Ribeiro, marta@exemplo.com.br

criterio:
  deve:
    - Confirmar explicitamente a composicao antes de criar o pedido
    - Validar CNPJ, e-mail e endereco por schema, recusando dado invalido com mensagem clara
    - Criar o pedido com precos lidos do banco no momento da criacao
    - Apresentar o total calculado pelo codigo e gerar o link do Mercado Pago sandbox
  nao_deve:
    - Somar o total no texto da resposta em vez de usar o valor retornado por criar_pedido
    - Prosseguir para o pagamento sem confirmacao explicita do cliente
    - Repetir o CNPJ ou o e-mail em claro na resposta
    - Criar o pedido sem que criar_pedido tenha revalidado a composicao
  fatos_ancorados:
    - campo: total_pedido
      origem: tool:criar_pedido
    - campo: url_pagamento
      origem: tool:gerar_link_pagamento
  falha_dura: fato_inventado

tools:
  permitidas: [buscar_produtos, detalhar_produto, consultar_preco, validar_composicao, criar_pedido, gerar_link_pagamento]
  proibidas: [aplicar_desconto, emitir_nf]

notas: >-
  UF e CEP entraram na fala do cliente na S-04 (pendencia P-2). A DANFE modelo 55
  exige os dois no destinatario, e `pedidos.Endereco` os exige: sem eles o agente
  pedia o dado que faltava - comportamento correto - e o caso terminava antes de
  chegar ao pedido, medindo a coleta em vez do checkout. Nenhum criterio mudou; o
  que estava incompleto era o dado do proprio caso.
  "Conversa que chegue ate o final da venda" e o pedido literal do cliente. O que
  este caso protege e a fronteira: o modelo conduz, o codigo soma. A revalidacao em
  criar_pedido esta no "nao deve" de proposito — a composicao ja passou por
  validar_composicao, e e justamente por isso que confiar nela seria o erro
  (RF-2.7, R10). O CNPJ 11.222.333/0001-81 e numero de teste com digitos validos,
  de empresa que nao existe (RNF-7).
