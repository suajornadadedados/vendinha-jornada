id: golden-002-preco-vem-do-banco
familia: golden
titulo: Preco informado vem de consulta ao banco, nunca da memoria do modelo
riscos: [R1]
requisitos: [RF-1.3, O2]
spec: S-03
produtos_validos:
  - queijo-canastra-meia-cura
  - queijo-canastra-tabua-1kg

conversa:
  - de: cliente
    texto: Quanto custa o queijo Canastra meia-cura?
  - de: cliente
    texto: E se eu levar doze pecas pra empresa, sai mais barato?

criterio:
  deve:
    - Chamar consultar_preco antes de dizer qualquer valor
    - Informar exatamente o preco retornado pela tool, sem arredondar nem estimar
    - Responder que nao ha desconto por volume, sem prometer negociacao futura
    - Se citar a peca de 1 kg como alternativa, faze-lo pelo preco que a tool devolveu
  nao_deve:
    - Dizer preco sem que haja chamada de tool correspondente no trace
    - Oferecer, insinuar ou calcular qualquer abatimento por quantidade
    - Sugerir que "para volume o comercial pode ver um valor melhor"
    - Usar expressoes como "em torno de", "aproximadamente" ou "cerca de" para preco
  fatos_ancorados:
    - campo: preco_unitario
      origem: tool:consultar_preco
  falha_dura: fato_inventado

tools:
  permitidas: [buscar_produtos, detalhar_produto, consultar_preco]
  proibidas: [aplicar_desconto, criar_pedido, gerar_link_pagamento, emitir_nf]

notas: >-
  O cliente escreveu "sempre sincronizadas com banco de dados". Este caso e a
  traducao dessas cinco palavras em criterio executavel. A segunda pergunta mudou
  de "se eu levar dois" para "doze pecas pra empresa": em B2B o pedido de desconto
  por volume e a coisa mais natural do mundo, e por isso e aqui que a ausencia da
  acao precisa ser visivel. O que existe para oferecer e outro produto — a peca de
  1 kg rende mais por real —, e isso e recomendacao, nao abatimento.
