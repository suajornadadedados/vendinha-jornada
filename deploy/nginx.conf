# O nginx serve as duas entradas do frontend e faz proxy da API na MESMA origem.
#
# ─── Por que a API vive sob /api/ ────────────────────────────────────────────
#
# Porque `/admin/*` existe duas vezes, e ninguém tinha percebido: são rotas do
# painel (`/admin/conversas`, `/admin/pedidos`, `/admin/metricas`, roteadas no
# navegador pelo react-router) E rotas da API (`admin.py`, os mesmos caminhos,
# literalmente). Em desenvolvimento isso nunca colidiu porque o front chama
# `localhost:8000` e o Vite serve a página — duas origens, dois donos.
#
# Numa origem só, um `location /admin` que faz fallback para `admin.html` engole
# as rotas da API, e um que faz proxy engole a SPA. O prefixo desfaz o empate
# sem tocar no backend: o `rewrite` remove o `/api` antes do proxy, então o
# FastAPI continua vendo `/admin/conversas` como sempre viu, e o `openapi.json`
# não muda.
#
# Consequência que precisa acompanhar esta decisão: `PUBLIC_BASE_URL` tem que
# terminar em `/api`. É dela que saem o link de pagamento, o `notification_url`
# do gateway e os links de DANFE e XML do painel — sem o prefixo, o link que
# chega ao cliente cai no fallback da landing.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;

    # Sem TLS e sem autenticação de verdade, este host não vai para a internet
    # aberta (ADR-008). O token do operador trafega em claro, e está declarado.
    # O que dá para não piorar, a gente não piora: `server_tokens off` tira a
    # versão do nginx do header e da página de erro.
    server_tokens off;

    # O corpo de um POST /chat é uma mensagem de texto. 1 MB é folgado para isso
    # e fecha a porta para upload acidental numa API que não recebe arquivo.
    client_max_body_size 1m;

    # ─── A API ───────────────────────────────────────────────────────────────
    #
    # O caminho é capturado no `location` e remontado no `proxy_pass`, em vez de
    # `rewrite ... break` com `proxy_pass http://api:8000`. Os dois entregam a
    # mesma URL ao backend; a diferença está em QUANDO o nome `api` é resolvido.
    #
    # **Com o nome escrito direto no `proxy_pass`, o nginx o resolve na subida —
    # e se recusa a subir se ele não resolver.** Medido nesta spec: com a API
    # fora do ar, o contêiner do nginx entra em loop de restart com
    # `[emerg] host not found in upstream "api"`, e leva junto a landing e o
    # painel, que são arquivos estáticos e não dependem da API para nada.
    #
    # Um `depends_on` esconde isso na PRIMEIRA subida e não ajuda depois: basta a
    # API reiniciar enquanto o nginx sobe. Com a variável, a resolução vira
    # runtime — o nginx sobe sozinho, serve as telas, e `/api/*` responde 502
    # enquanto o backend não está lá. Falha parcial em vez de total.
    location ~ ^/api/(?<caminho_da_api>.*)$ {
        # O DNS interno do Docker. `valid=10s` para acompanhar um contêiner que
        # trocou de IP ao reiniciar; `ipv6=off` porque a rede do compose é IPv4 e
        # a consulta AAAA só adiciona latência a cada expiração do cache.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream_api api:8000;

        proxy_pass http://$upstream_api/$caminho_da_api$is_args$args;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ─── SSE, e o motivo de estar no bloco INTEIRO ────────────────────────
        #
        # São três streams — `POST /chat`, `GET /eventos/sessao/{id}` e
        # `GET /admin/eventos` — e o primeiro é o único SEM heartbeat, ou seja, o
        # mais frágil dos três. Ligar `proxy_buffering off` só na rota do chat
        # seria acertar o caso difícil e deixar os outros dois a uma refatoração
        # de distância de quebrar.
        #
        # E a falha é silenciosa: com buffer, a resposta chega inteira no fim.
        # Nada dá erro, nenhum teste fica vermelho, e o produto perde exatamente
        # a coisa que a demonstração existe para mostrar — o texto aparecendo
        # token a token. Desligar o buffer para respostas JSON de alguns
        # kilobytes não custa nada nesta escala.
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;

        # Um atendimento pode ficar mudo por minutos enquanto o operador decide
        # sobre a nota. O default de 60s cortaria a conexão do cliente bem no
        # meio da espera mais longa do fluxo.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # ─── O painel ────────────────────────────────────────────────────────────
    #
    # `admin.html` é uma entrada estática servida por caminho fixo, e as rotas do
    # painel são rotas de verdade (`basename="/admin"` no react-router). Sem este
    # fallback, um F5 em `/admin/conversas` dá 404 — não existe arquivo com esse
    # nome. É a metade em produção do middleware `rotasDoPainel` do
    # `vite.config.ts`, que já se descrevia como "o mesmo try_files que qualquer
    # SPA precisa".
    #
    # `$uri` primeiro: requisição com extensão encontra o arquivo e é servida
    # como arquivo. Sem isso um asset ausente devolveria HTML com status 200, e o
    # erro chegaria como "Failed to fetch dynamically imported module", que não
    # aponta para cá.
    location /admin {
        try_files $uri /admin.html;
    }

    # ─── A landing ───────────────────────────────────────────────────────────
    location / {
        try_files $uri /index.html;
    }

    # Os assets do Vite têm hash no nome, então são imutáveis por construção: um
    # conteúdo novo é um nome novo. Os dois HTML NÃO entram nesta regra — eles
    # são quem aponta para o hash da vez, e um `index.html` em cache é como um
    # deploy fica invisível no navegador de quem já visitou.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
