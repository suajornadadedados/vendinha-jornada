name: CI
# Checks obrigatórios na main: commitlint, lint, test, secrets, skills-drift,
# typecheck, evals.
# Os nomes dos jobs abaixo devem bater com os "required status checks" do ruleset.
#
# `typecheck` e `evals` ficam SKIPPED até existir o arquivo que cada um precisa,
# em vez de vermelhos. Check vermelho permanente treina a ignorar CI vermelho;
# check pulado liga sozinho quando a spec entra. Cada um observa o SEU gatilho:
# `typecheck` liga com o scaffold do backend (S-00); `evals` liga com o script
# que sobe a infraestrutura e roda a suíte (S-06). Apontar os dois para o mesmo
# arquivo faria o scaffold da S-00 ligar um job cujo código ainda não existe.
#
# O gatilho do `evals` MUDOU na S-03, e o motivo importa. Ele apontava para
# `backend/evals/runner.py`, um caminho que nunca existiu: a S-03 entregou o
# runner em `backend/vendinha/evals/runner.py`, e a heurística teria continuado
# `false` para sempre, parecendo "ainda não chegou" quando na verdade já tinha
# chegado. A verificação independente da S-03 pegou isso (NC-5).
#
# **A S-06 escreveu `scripts/evals-ci.sh`, e com isso o `evals` ligou sozinho** —
# que era exatamente o desenho: gatilho que descreve o que falta de verdade não
# caduca em silêncio, e sai do caminho quando a coisa chega. O comentário anterior
# dizia que o job "não pode ligar hoje"; agora pode, e este parágrafo é o registro
# da virada. O `detect` continua como está: se alguém apagar o script, o job volta
# a pular em vez de ficar vermelho para sempre.
#
# O gatilho é calculado pelo job `detect`, e NÃO por `if: hashFiles(...)` no
# nível do job: `hashFiles` só é permitido em contexto de step. Usá-la em
# `jobs.<id>.if` não dá erro de job — quebra o parse do arquivo inteiro, e o
# workflow vira startup_failure: zero job executado, nenhum log, e o merge
# liberado porque não há check nenhum reportando. Era o estado deste repositório
# até a S-00 (D-10). Semanticamente também estaria errado: no `if` do job o
# workspace ainda não foi clonado, então hashFiles responderia vazio sempre.
on:
  pull_request:
    branches: [main]

jobs:
  # Decide quais jobs condicionais ligam. Precisa do checkout — é justamente o que
  # falta no contexto de `jobs.<id>.if`.
  detect:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.files.outputs.backend }}
      evals: ${{ steps.files.outputs.evals }}
    steps:
      - uses: actions/checkout@v4
      - id: files
        run: |
          test -f backend/pyproject.toml && echo "backend=true" >> "$GITHUB_OUTPUT" || echo "backend=false" >> "$GITHUB_OUTPUT"
          test -f scripts/evals-ci.sh && echo "evals=true"   >> "$GITHUB_OUTPUT" || echo "evals=false"   >> "$GITHUB_OUTPUT"

  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: wagoid/commitlint-github-action@v6

  # Uma régua de lint só, na raiz (ruff.toml), valendo para scripts/, tests/ e
  # backend/ quando ele existir. O actionlint entra aqui, e não como job próprio,
  # porque `lint` já é check obrigatório — job novo exigiria mexer na proteção da
  # branch para valer de alguma coisa.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      # Versao FIXA, e igual a do grupo dev do backend. Com `pip install ruff`
      # solto, a regua do CI anda sozinha: um `ruff` mais novo traz regra nova e
      # reprova um PR que passou na maquina de quem escreveu, sem nada ter mudado
      # no codigo. Aconteceu na S-02 com a UP047. Ao subir a versao, suba nos dois
      # lugares no mesmo commit.
      - run: pip install ruff==0.16.4
      - run: ruff check .
      - run: ruff format --check .

      # Este passo é o portão de regressão da D-10. Uma expressão inválida num
      # workflow não reprova um job: ela quebra o parse do arquivo inteiro, o
      # workflow vira startup_failure e NENHUM check reporta — foi assim que o CI
      # deste repositório passou seis dias sem executar, sem ninguém notar,
      # justamente porque a ausência de check não parece um erro. Validar YAML não
      # pega isso: YAML válido não é schema de workflow válido.
      - name: actionlint
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.9 -color

  # unit + security. Nenhuma das duas camadas precisa de contêiner — é
  # consequência de não existir camada de integração (docs/testes.md §1).
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r tests/requirements.txt
      - run: bash scripts/run-tests.sh

  # Credencial no diff. Roda no histórico completo do PR, não só no head.
  #
  # Binário oficial, não a action `gitleaks/gitleaks-action@v2`: aquela action exige
  # licença PAGA quando o repositório pertence a uma organização — e este pertence.
  # Ela falhava com "is an organization. License key is required", ou seja, o portão
  # de segredo nunca chegou a escanear nada. A allowlist do scanner está em
  # .gitleaks.toml, versionada e justificada (D-12).
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.29.0             git /repo --config /repo/.gitleaks.toml --redact --verbose

  # .claude/skills/ é derivado do lockfile (ADR-009). Este job é a sanção da
  # regra "não edite uma skill vendorizada à mão".
  skills-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: bash scripts/vendor-skills.sh --check
      - run: bash scripts/gen-skills-doc.sh --check

  typecheck:
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --dev
        working-directory: backend
      - run: uv run mypy .
        working-directory: backend

      # A suite tambem entra no portao desde a S-02 (ressalva R-4 da verificacao
      # da S-01): havia tipagem escrita em tests/ que nada verificava. Roda da
      # raiz e com --explicit-package-bases porque tests/unit/conftest.py e
      # tests/security/conftest.py tem o mesmo nome de modulo — o mesmo motivo
      # pelo qual o pytest usa --import-mode=importlib.
      - name: mypy na suite
        run: uv run --project backend mypy --config-file backend/pyproject.toml --explicit-package-bases tests

  # O portao de contrato da S-07 (REQ-1). Regera o openapi.json a partir dos
  # modelos Pydantic e compara com o que esta commitado: se um campo mudou e
  # ninguem rodou `make types`, o cliente TypeScript esta descrevendo uma API que
  # nao existe mais, e o build para aqui em vez de a tela quebrar em runtime.
  #
  # Nao sobe servidor: `app.openapi()` e funcao pura sobre os modelos. Um gerador
  # que precisasse da API de pe seria teste de integracao, que a ADR-011 recusou.
  contrato:
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --dev
        working-directory: backend
      - name: regera o openapi.json
        run: uv run --project backend python -m vendinha.openapi
      - name: o contrato commitado bate com os modelos
        run: |
          if ! git diff --exit-code -- openapi.json; then
            echo "::error::openapi.json esta desatualizado. Rode 'make types' e commite."
            exit 1
          fi

  # A camada 1 do ADR-014: as sub-suítes que o diff pode ter mudado. Required
  # check a partir da S-06, que é quando `scripts/evals-ci.sh` passou a existir e
  # o `detect` acima começou a ligar este job sozinho.
  #
  # **O escopo é decidido DENTRO do script, e nunca por um path filter aqui.** Um
  # job pulado que é required trava a `main` para sempre; o script sai 0 dizendo
  # "nada a avaliar neste diff" e o check fica verde. É a outra metade do problema
  # que o job `detect` resolveu na S-00 (D-10).
  #
  # `fetch-depth: 0` porque o escopo vem de um `git merge-base` com a `origin/main`
  # — com o clone raso do default o merge-base não existe, o script cai no ramo
  # "base indisponível" e roda a suíte inteira em todo PR. Caro, não inseguro, e
  # exatamente o tipo de desperdício silencioso que o ADR-014 quis evitar.
  #
  # A suíte inteira roda no pós-merge, em `evals-pos-merge.yml`.
  evals:
    needs: detect
    if: needs.detect.outputs.evals == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --dev
        working-directory: backend
      - run: bash scripts/evals-ci.sh
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LANGFUSE_BASE_URL: ${{ secrets.LANGFUSE_BASE_URL }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
